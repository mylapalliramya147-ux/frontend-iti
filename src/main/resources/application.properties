spring.application.name=frontend

# Backend API Configuration
# Points to the Node.js reports API (proxied by the UnifiedApp backend).
# Matches the deployed endpoint used by the backend JSPs (10.72.4.135:5051/reports/...).
backend.api.base-url=http://10.72.4.135:5051
backend.api.reports-path=/reports

# Server Configuration
server.port=5051

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.server.frontend=DEBUG
