spring.application.name=frontend

# Backend API Configuration
backend.api.base-url=http://localhost:8080/ItiapInstitute
backend.api.iti-path=/api/itis
backend.api.district-path=/api/districts
backend.api.designation-path=/api/designations
backend.api.shift-unit-path=/api/shift-unit-permitted

# Frontend Server
server.port=5051


# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.server.frontend=DEBUG