# ── Local overrides (untracked) ──────────────────────────────────────────
# Copy .env.example to .env and put YOUR OWN values there. Never commit .env.
# Spring Boot loads .env automatically via `spring.config.import` below.
spring.config.import=optional:file:.env[.properties]

spring.application.name=frontend

# Single backend base URL — all frontend modules use this to reach the Backend
backend.api.base-url=${BACKEND_URL:http://localhost:5050}

# Frontend Server
server.port=5051

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/

spring.mvc.view.suffix=.jsp

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.server.frontend=DEBUG